name: ci-release

# Tests run on every push / PR. A push to main (git flow: main only receives
# finished releases and hotfixes) publishes GitHub release v<version> with the
# Claude Desktop bundle. This does not rely on tag push events: the tag is
# reused if it exists, otherwise created at the main commit.

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -q

  bundle:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check versions match
        id: version
        run: |
          v_manifest=$(jq -r .version manifest.json)
          v_py=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          v_init=$(grep -m1 '__version__' src/fluidmeet_mcp/__init__.py | cut -d'"' -f2)
          echo "manifest=$v_manifest pyproject=$v_py __init__=$v_init"
          if [ "$v_manifest" != "$v_py" ] || [ "$v_manifest" != "$v_init" ]; then
            echo "::error::Version mismatch: manifest=$v_manifest pyproject=$v_py __init__=$v_init"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$v_manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version v$v_manifest"; exit 1
          fi
          echo "version=$v_manifest" >> "$GITHUB_OUTPUT"
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: mkdir -p dist && npx -y @anthropic-ai/mcpb@2.1.2 pack . dist/fluidmeet.mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: fluidmeet.mcpb
          path: dist/fluidmeet.mcpb
          if-no-files-found: error

  release:
    needs: bundle
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-v${{ needs.bundle.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: fluidmeet.mcpb
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.bundle.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating asset"
            gh release upload "$TAG" dist/fluidmeet.mcpb --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" dist/fluidmeet.mcpb \
              --target "$GITHUB_SHA" \
              --title "FluidMeet MCP $TAG" \
              --generate-notes
          fi
